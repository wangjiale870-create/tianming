<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>职业性格测试中心</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f0eb; color:#333;
  min-height:100vh; display:flex; justify-content:center;
}
.container { width:100%; max-width:420px; min-height:100vh; position:relative; background:#fff; }
.screen { display:none; flex-direction:column; min-height:100vh; opacity:0; transition:opacity .25s; }
.screen.active { display:flex; opacity:1; }

/* ===== 首页 ===== */
.home-top {
  background: linear-gradient(135deg, #4a3cdb 0%, #8b5cf6 50%, #ec4899 100%);
  color:#fff; text-align:center; padding:44px 24px 32px;
}
.home-top h1 { font-size:24px; font-weight:bold; letter-spacing:2px; margin-bottom:6px; }
.home-top p  { font-size:13px; opacity:0.85; }
.home-body { background:#f8f7f4; padding:20px 16px; flex:1; }
.test-card {
  display:flex; align-items:center; background:#fff; border-radius:14px;
  padding:18px 16px; margin-bottom:14px; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.04); transition:transform .15s;
}
.test-card:active { transform:scale(0.98); }
.test-card .tc-icon { font-size:36px; width:52px; text-align:center; flex-shrink:0; }
.test-card .tc-info { flex:1; margin-left:12px; }
.test-card .tc-name { font-size:16px; font-weight:bold; color:#333; }
.test-card .tc-desc { font-size:12px; color:#999; margin-top:3px; }
.test-card .tc-meta { font-size:11px; color:#bbb; margin-top:3px; }
.test-card .tc-arrow { font-size:18px; color:#ccc; flex-shrink:0; }

/* ===== 题目 ===== */
#quiz { padding:24px 20px; }
.pb-wrap { height:4px; background:#eee; border-radius:2px; margin-bottom:28px; }
.pb-fill { height:100%; border-radius:2px; transition:width .3s; }
.q-num { font-size:12px; color:#999; margin-bottom:6px; }
.q-text { font-size:18px; font-weight:bold; color:#333; margin-bottom:24px; line-height:1.5; }
.opt {
  display:block; width:100%; padding:14px 16px; margin-bottom:8px;
  background:#f8f7f4; border:1px solid #e8e4de; border-radius:10px;
  color:#555; font-size:14px; text-align:left; cursor:pointer; transition:all .15s;
}
.opt:active { background:#ede8ff; border-color:#667eea; color:#333; }
.back-link { display:block; margin-top:16px; text-align:center; color:#aaa; font-size:12px; cursor:pointer; }

/* ===== 免费结果 ===== */
#result { padding:24px 20px; }
.res-hd { text-align:center; margin:20px 0 24px; }
.res-icon { font-size:64px; margin-bottom:10px; }
.res-name { font-size:22px; font-weight:bold; color:#333; margin-bottom:4px; letter-spacing:2px; }
.res-sub  { font-size:13px; color:#999; }
.res-card {
  background:#f8f7f4; border-radius:12px; padding:18px; margin-bottom:20px;
}
.res-card h3 { font-size:14px; color:#667eea; margin-bottom:10px; }
.res-card p { font-size:13px; color:#666; line-height:1.8; }

.lock-box {
  position:relative; border-radius:12px; overflow:hidden; margin:16px 0;
  background:#fafafa; border:1px solid #eee;
}
.lock-pv { padding:18px; filter:blur(5px); user-select:none; }
.lock-pv h3 { font-size:14px; color:#667eea; margin-bottom:8px; }
.lock-pv p { font-size:12px; color:#999; line-height:1.8; }
.lock-cv {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:rgba(255,255,255,0.65);
}
.lock-ico { font-size:28px; margin-bottom:6px; animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
.lock-txt { font-size:14px; color:#667eea; font-weight:bold; margin-bottom:4px; }
.lock-sub { font-size:11px; color:#999; margin-bottom:12px; }
.unlock-btn {
  padding:10px 28px; background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff; border:none; border-radius:20px; font-size:14px; font-weight:bold;
  cursor:pointer; letter-spacing:1px;
}
.unlock-btn:active { transform:scale(0.96); }

.share-bar { text-align:center; margin-top:20px; padding-bottom:30px; }
.share-btn {
  padding:12px 36px; background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff; border:none; border-radius:24px; font-size:14px; font-weight:bold;
  cursor:pointer; letter-spacing:1px; box-shadow:0 4px 12px rgba(102,126,234,0.3);
}
.share-btn:active { transform:scale(0.96); }
.retest-link { text-align:center; margin-top:6px; }
.retest-link span { color:#aaa; font-size:12px; cursor:pointer; text-decoration:underline; }

/* ===== 完整报告 ===== */
#full { padding:24px 20px; }
.sec { margin-bottom:22px; }
.sec h3 { font-size:15px; color:#667eea; margin-bottom:10px; border-left:3px solid #667eea; padding-left:10px; }
.sec p,.sec li { font-size:13px; color:#555; line-height:1.9; }
.sec ul { padding-left:16px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag {
  padding:5px 14px; background:#ede8ff; color:#667eea;
  border-radius:14px; font-size:12px;
}

.toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.8); color:#fff; padding:12px 24px;
  border-radius:8px; font-size:13px; z-index:99; display:none;
}
</style>
</head>
<body>
<div class="container">

<!-- ==================== 首页 ==================== -->
<div class="screen active" id="home">
  <div class="home-top">
    <h1>🔮 性格测试中心</h1>
    <p>了解自己，找到最适合你的人生方向</p>

        <div class="tc-meta">50 题 · 6 种职业类型 · 全球通用</div>
      </div>
      <div class="tc-arrow">›</div>
    </div>
    <div class="test-card" onclick="selectTest('enneagram')">
      <div class="tc-icon">🎭</div>
      <div class="tc-info">
        <div class="tc-name">九型人格测试</div>

      </div>
      <div class="tc-arrow">›</div>
    </div>
    <div class="test-card" onclick="selectTest('color')">
      <div class="tc-icon">🎨</div>
      <div class="tc-info">
        <div class="tc-name">性格色彩测试</div>
        <div class="tc-desc">红蓝黄绿，你是哪一种颜色？</div>
        <div class="tc-meta">50 题 · 4 色人格 · 风靡全网</div>
      </div>
      <div class="tc-arrow">›</div>
    </div>
  </div>
</div>

<!-- ==================== 题目 ==================== -->
<div class="screen" id="quiz">
  <div class="pb-wrap"><div class="pb-fill" id="pbar" style="background:linear-gradient(90deg,#667eea,#764ba2)"></div></div>
  <div class="q-num" id="qnum"></div>
  <div class="q-text" id="qtext"></div>
  <div id="opts"></div>
  <div class="back-link" onclick="show('home')">← 返回首页，换一种测试</div>
</div>

<!-- ==================== 免费结果 ==================== -->
<div class="screen" id="result">
  <div class="res-hd">
    <div class="res-icon" id="ricon"></div>
    <div class="res-name" id="rname"></div>
    <div class="res-sub" id="rsub"></div>
  </div>
  <div class="res-card" id="rcard"></div>
  <div class="lock-box">
    <div class="lock-pv" id="lpv"></div>
    <div class="lock-cv">
      <div class="lock-ico">🔒</div>
      <div class="lock-txt">都做了 50 题了</div>
      <div class="lock-sub">今日已有 <b id="unlockCount">3,842</b> 人解锁完整报告</div>
      <button class="unlock-btn" onclick="unlock()">看段广告 · 免费解锁 🎁</button>
    </div>
  </div>
  <div class="share-bar">
    <button class="share-btn" onclick="shareIt()">📤 测测朋友是什么类型</button>
  </div>
  <div class="back-link" onclick="show('home')">← 返回首页</div>
</div>

<!-- ==================== 完整报告 ==================== -->
<div class="screen" id="full">
  <div class="res-hd">
    <div class="res-icon" id="fricon"></div>
    <div class="res-name" id="frname"></div>
  </div>
  <div id="frbody"></div>
  <div class="share-bar" style="padding-top:10px;">
    <button class="share-btn" onclick="shareIt()">📤 测测朋友是什么类型</button>
  </div>
  <div class="back-link" onclick="show('home')">← 返回首页，测别的</div>
</div>

</div>
<div class="toast" id="toast"></div>

  summary:'你是典型的"黄色性格"——像正午的阳光，自信、有力、目标明确。你天生知道"我要什么"并愿意为之付出努力。你讨厌平庸，渴望卓越，对"混日子"的人理解无能。你的领导力和感染力让人愿意跟随你，但你有时候也给人"太强势"的感觉。',
  traits:['目标导向','自信果断','领导力强','追求卓越','不轻易放弃'],
  careers:'CEO、管理层、律师、导演、制片人、投资顾问、政治家、品牌创始人',
  weak:'太关注结果，容易把人当成"资源"而不是"人"。工作狂倾向——注意健康和家庭关系。',
  advice:'你已经很成功了，但真正的成功不是"赢了多少"而是"跟谁一起赢"。偶尔慢下来，陪陪身边的人，他们才是你最重要的资产。和绿色性格的人在一起，他们能让你柔软下来。' },
G:{ icon:'🟢', name:'绿色性格 · 平和派', sub:'温和、包容、以和为贵',
  summary:'你是典型的"绿色性格"——像草地和森林，给人稳定、安全、安心的感觉。你温和包容，善于倾听，朋友在你身边会觉得特别放松。你不喜欢冲突，愿意退一步保持和谐。但有时候你会因为"太好说话"而委屈了自己。你最怕的是"伤害别人"和"关系破裂"。',
  traits:['温和','包容','善于倾听','稳定可靠','有耐心'],
  careers:'心理咨询师、教师、护士、社工、HR、客服、调解员、行政、公务员',
  weak:'为了维护和谐，常压抑自己的真实想法。不懂得说"不"，容易被人"占便宜"。需要练习"为自己发声"。',
  advice:'你的温暖是这个世界的稀缺资源。但"好人"不等于"好欺负"。偶尔学会说"这是我的底线"，关系反而会更健康。和黄色性格的人做朋友，他们会帮你"争取权益"。' }
};

// ==================== 测试配置 ====================
const tests = {
  holland:  { name:'霍兰德职业兴趣测试', questions:HOLLAND_Q,  results:HOLLAND_RES,  types:['R','I','A','S','E','C'], color:'#667eea' },
  enneagram:{ name:'九型人格测试',     questions:ENNEAGRAM_Q, results:ENNEAGRAM_RES, types:['1','2','3','4','5','6','7','8','9'], color:'#ec4899' },
  color:    { name:'性格色彩测试',     questions:COLOR_Q,     results:COLOR_RES,     types:['R','B','Y','G'], color:'#f59e0b' },
};

// ==================== 全局状态 ====================
let currentTest = null;
let scores = {}, qi=0, result=null, unlocked=false;

function $(id){ return document.getElementById(id); }
function show(id){
  ['home','quiz','result','full'].forEach(s=>$(s).classList.remove('active'));
  $(id).classList.add('active'); window.scrollTo(0,0);
}
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',1500); }

// ==================== 选择测试 ====================
function selectTest(key){
  const t = tests[key];
  currentTest = t;
  scores = {}; for(let k of t.types) scores[k]=0;
  qi=0; result=null; unlocked=false;
  show('quiz');
  var pb = document.getElementById('pbar');
  if(pb) pb.style.background = 'linear-gradient(90deg,'+t.color+',#764ba2)';
  renderQ();
}

// ==================== 题目 ====================
function renderQ(){
  const t = currentTest;
  if(qi >= t.questions.length){ finish(); return; }
  const q = t.questions[qi];
  $('pbar').style.width = ((qi+1)/t.questions.length*100)+'%';
  $('qnum').textContent = `${t.name} · 第 ${qi+1} / ${t.questions.length} 题`;
  $('qtext').textContent = q.text;
  const o = $('opts'); o.innerHTML = '';
  ['非常符合','比较符合','不太符合','完全不符'].forEach((label,i)=>{
    const b = document.createElement('button'); b.className='opt'; b.textContent=label;
    b.onclick = () => {
      const sc = (3-i);
      const types = q.type.split('');
      for(let k of types) scores[k] = (scores[k]||0) + sc;
      qi++; renderQ();
    };
    o.appendChild(b);
  });
}

// ==================== 结算 ====================
function finish(){
  let max=0, best=currentTest.types[0];
  for(let k in scores){ if(scores[k]>max){ max=scores[k]; best=k; } }
  result = currentTest.results[best]; unlocked=false; renderRes(); show('result');
}

function renderRes(){
  const r = result;
  $('ricon').textContent = r.icon;
  $('rname').textContent = r.name;
  $('rsub').textContent = r.sub || '';
  $('rcard').innerHTML = `<h3>概述</h3><p>${r.summary}</p>`;
  $('lpv').innerHTML = `<h3>完整报告包含</h3><p>✦ 性格特质详析<br>✦ 适合职业列表<br>✦ 弱点与注意提醒<br>✦ 个性化发展建议</p>`;
}

// ==================== 解锁 ====================
function unlock(){
  unlocked=true; renderFull(); show('full');
}
function renderFull(){
  const r = result;
  $('fricon').textContent = r.icon;
  $('frname').textContent = r.name + ' · 完整报告';
  $('frbody').innerHTML = `
    <div class="sec"><h3>🔍 人格概述</h3><p>${r.summary}</p></div>
    <div class="sec"><h3>📋 性格特质</h3><div class="tags">${(r.traits||[]).map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div>
    <div class="sec"><h3>💼 适配职业</h3><p>${r.careers||''}</p></div>
    <div class="sec"><h3>⚠️ 注意提醒</h3><p>${r.weak||''}</p></div>
    <div class="sec"><h3>💡 发展建议</h3><p>${r.advice||''}</p></div>`;
}

// 社交证明
(function(){ var c=3800+Math.floor(Math.random()*400); setInterval(function(){ c+=Math.floor(Math.random()*3); document.getElementById('unlockCount').textContent=c.toLocaleString(); },8000+Math.random()*4000); })();

function shareIt(){
  if(!result) return;
  const t = currentTest;
  const msg = `${$('ricon').textContent} 我在「${t.name}」中测出：${result.name}

测测你是什么类型？`;
  if(navigator.share){ navigator.share({title:t.name,text:msg,url:location.href}); }
  else { navigator.clipboard.writeText(msg+'\n'+location.href).then(()=>toast('已复制！发给朋友吧')); }
}
</script>
